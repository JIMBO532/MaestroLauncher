<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MaestroLauncher</title>
<!-- Barlow: squared, technical, real thin weights, and it tracks out well in
     caps. Progressive enhancement -- Segoe UI Variable carries the layout if
     the machine is offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- The screenshot is what makes this layout read as a Minecraft launcher; the
     drawn horizon that stood in for it never did. Decorative, so it is a
     background rather than an <img> and stays out of the accessibility tree. -->
<div class="backdrop" aria-hidden="true"></div>

<div class="dropzone-hint" id="dropzone-hint" aria-hidden="true" hidden>Drop image to set background</div>

<main class="stage">

  <div class="brand">
    <img class="logo" src="assets/logo.png" alt="" draggable="false">
    <span class="wordmark">MaestroLauncher</span>
  </div>

  <!-- Top right: account. The blocky head is the strongest Minecraft cue on the
       screen that costs no asset -- a generic skin silhouette, not anyone's. -->
  <button class="account" type="button" aria-label="Sign in to your Microsoft account">
    <span class="account__label">Sign in</span>
    <span class="skin" aria-hidden="true">
      <svg viewBox="0 0 8 8" shape-rendering="crispEdges">
        <rect x="0" y="0" width="8" height="8" fill="#6b4b34"></rect>
        <rect x="0" y="0" width="8" height="2" fill="#4a3323"></rect>
        <rect x="1" y="3" width="6" height="4" fill="#b08160"></rect>
        <rect x="0" y="3" width="1" height="4" fill="#8a6247"></rect>
        <rect x="7" y="3" width="1" height="4" fill="#8a6247"></rect>
        <rect x="2" y="4" width="1" height="1" fill="#ffffff"></rect>
        <rect x="5" y="4" width="1" height="1" fill="#ffffff"></rect>
        <rect x="2" y="4" width="1" height="1" fill="#3b5a9b"></rect>
        <rect x="5" y="4" width="1" height="1" fill="#3b5a9b"></rect>
      </svg>
    </span>
  </button>

  <nav class="rail" aria-label="Sections">
    <button class="rail__item" type="button" aria-label="Content">
      <span class="rail__label" aria-hidden="true">Content</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="12 2 2 7 12 12 22 7 12 2"></polyline>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
    </button>
    <button class="rail__item" id="settings-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="settings-panel" aria-label="Settings">
      <span class="rail__label" aria-hidden="true">Settings</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="4" y1="7" x2="20" y2="7"></line>
        <line x1="4" y1="12" x2="20" y2="12"></line>
        <line x1="4" y1="17" x2="20" y2="17"></line>
        <circle cx="9" cy="7" r="2.2" fill="#0a0a0a"></circle>
        <circle cx="15" cy="12" r="2.2" fill="#0a0a0a"></circle>
        <circle cx="8" cy="17" r="2.2" fill="#0a0a0a"></circle>
      </svg>
    </button>
    <button class="rail__item" type="button" aria-label="About">
      <span class="rail__label" aria-hidden="true">About</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9.2"></circle>
        <line x1="12" y1="11" x2="12" y2="16.5"></line>
        <line x1="12" y1="7.6" x2="12.01" y2="7.6"></line>
      </svg>
    </button>
  </nav>

  <!-- Only the choice of background image and its reset live here; the rest
       of Settings is still a stub for a later slice. -->
  <div class="settings-panel" id="settings-panel" role="menu" aria-label="Settings" hidden>
    <button class="settings-panel__item" type="button" role="menuitem" data-action="choose-background">Change background image&hellip;</button>
    <button class="settings-panel__item settings-panel__item--reset" type="button" role="menuitem" data-action="reset-background">Reset to default</button>
  </div>
  <input type="file" id="background-file-input" accept="image/png,image/jpeg" hidden>

  <div class="bottom-group">
    <div class="dock">
      <button class="play" type="button">Play</button>

      <button class="version" type="button" aria-label="Choose version. Currently 1.21.1 Fabric">
        <span class="version__value">1.21.1 Fabric</span>
        <svg class="version__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 15 12 9 18 15"></polyline>
        </svg>
      </button>
    </div>

    <!-- Centred under Play as a group. Green is state and only ever state, so
         the dot is the one place it appears. Placeholder values in slice 1;
         nothing behind them yet. -->
    <div class="status">
      <div class="status__item">
        <span class="status__key">Installed</span>
        <span class="status__value">1.21.1 &middot; Fabric</span>
      </div>
      <span class="status__rule" aria-hidden="true"></span>
      <div class="status__item">
        <span class="status__key">Mojang</span>
        <span class="status__value">
          <span class="dot" aria-hidden="true"></span>Online
        </span>
      </div>
    </div>
  </div>

</main>

<script src="app.js"></script>
</body>
</html>
